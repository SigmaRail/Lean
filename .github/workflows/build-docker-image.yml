name: Build & Publish LEAN Docker Image

on:
  push:
    branches:
      - vera/master
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'Dockerfile'
      - 'build-docker-image'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
        default: linux/amd64,linux/arm64

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lean-clickhouse

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Lean repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Free runner disk space (pre-build)
        run: |
          echo "=== Pre-cleanup ==="
          df -h /
          # Remove pre-installed dotnet SDKs we don't need to free ~2GB
          rm -rf /usr/share/dotnet/sdk/9.* /usr/share/dotnet/sdk/8.* /usr/share/dotnet/sdk/7.* /usr/share/dotnet/sdk/6.* 2>/dev/null || true
          rm -rf /usr/share/dotnet/shared/Microsoft.NETCore.App/6.* /usr/share/dotnet/shared/Microsoft.NETCore.App/7.* /usr/share/dotnet/shared/Microsoft.NETCore.App/8.* /usr/share/dotnet/shared/Microsoft.NETCore.App/9.* 2>/dev/null || true
          rm -rf /usr/share/dotnet/shared/Microsoft.AspNetCore.App/6.* /usr/share/dotnet/shared/Microsoft.AspNetCore.App/7.* /usr/share/dotnet/shared/Microsoft.AspNetCore.App/8.* /usr/share/dotnet/shared/Microsoft.AspNetCore.App/9.* 2>/dev/null || true
          # Clean apt cache, swap files, other cruft
          sudo apt-get clean -qq 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          # Remove Android SDK, .NET packages, etc
          sudo rm -rf /usr/share/android-sdk /usr/share/swift /usr/local/share/powershell 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          echo "=== After pre-cleanup ==="
          df -h /

      - name: Restore dependencies
        run: dotnet restore

      - name: Build LEAN solution (Release)
        run: dotnet build -c Release --no-restore

      - name: Free disk space before Docker build
        run: |
          # Aggressively free runner disk space for Docker build
          # .NET build (tests + all projects) + NuGet cache + Docker layers easily exceed ~14GB free
          echo "=== Disk before cleanup ==="
          df -h /
          du -sh /usr/share/dotnet/sdk 2>/dev/null || true
          du -sh /usr/share/dotnet/shared 2>/dev/null || true

          # Remove test and benchmark build artifacts
          rm -rf Tests/bin/Release/
          rm -rf Tests/obj/
          rm -rf Benchmarks/bin/Release/
          rm -rf Benchmarks/obj/
          rm -rf Optimizer/bin/Release/
          rm -rf Optimizer/obj/

          # Remove NuGet cache (we already restored)
          rm -rf ~/.nuget/packages/
          rm -rf /tmp/NuGetScratch/

          # Remove .NET SDK installers and temp files
          rm -rf /tmp/*.tar.gz /tmp/*.sh
          rm -rf /home/runner/.dotnet/**/*.tar.gz 2>/dev/null || true

          # Remove docker images that came with the runner (we only need lean:foundation)
          docker system prune -af --filter "until=24h" 2>/dev/null || true

          echo "=== Disk after cleanup ==="
          df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:8}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "Building and pushing: ${IMAGE}:latest, ${IMAGE}:${SHORT_SHA}"
          docker build -t "${IMAGE}:latest" -t "${IMAGE}:${SHORT_SHA}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${SHORT_SHA}"

          # Save tags for the summary step
          echo "tags=${IMAGE}:latest,${IMAGE}:${SHORT_SHA}" >> $GITHUB_ENV
          echo "platform=linux/amd64" >> $GITHUB_ENV

      - name: Image summary
        run: |
          echo "## LEAN Docker Image Published ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          IFS=',' read -ra TAGS <<< "${{ env.tags }}"
          for TAG in "${TAGS[@]}"; do
            echo "  - \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** ${{ env.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔒 Image is **private** on GitHub Container Registry." >> $GITHUB_STEP_SUMMARY
          echo "To change visibility, visit https://github.com/orgs/${{ github.repository_owner }}/packages" >> $GITHUB_STEP_SUMMARY
